# ═══════════════════════════════════════════════════════════════════════
# workspace 成员
# ═══════════════════════════════════════════════════════════════════════
packages:
  - 'apps/*'          # 交付层：一次可运行的装配（cli / 未来的 web、api）
  - 'packages/*/*'    # 能力层：两层结构 —— 能力域/包

# ═══════════════════════════════════════════════════════════════════════
# 版本目录（catalog）
#
# 所有包一律写 "catalog:"，版本号只在这里出现一次。
# 升级改这一处，物理上不可能漏改某个包而造成两份实体。
# ═══════════════════════════════════════════════════════════════════════
# 默认目录。大多数包用这个。
#
# 「版本号只写一处」不等于「全仓库只准有一个版本」——
# 不同 app 对同一个库依赖不同大版本是完全正常的（比如 web 用 react 19、
# marketing 的旧站还停在 18）。那种情况用【具名目录】，见文件末尾。
catalog:
  # —— 框架本体：必须全场唯一，各包一律以 peerDependencies 引用 ——
  '@deepseek-ai/cordis': '^4.0.1'

  # —— 宿主装配用：只有 apps/* 会装 ——
  '@deepseek-ai/cordis-plugin-loader': '^1.0.2'
  '@deepseek-ai/cordis-plugin-include': '^1.0.6'
  # loader 的可选 peer：给它 Node 内部 ESM 解析器，
  # 否则裸包名会从 loader 自己的位置解析而找不到（静默降级，不报错）
  'node-addon-require-builtin': '^0.1.5'
  # 把一组条目打包成「区」，配合 isolate 做多租户
  '@deepseek-ai/cordis-plugin-group': '^1.0.1'
  # 官方 exporter：把结构化日志渲染到终端
  '@deepseek-ai/cordis-plugin-logger-console': '^1.0.1'
  # 热重载：文件监视 + 局部重载。它 inject ['loader','timer']，所以 timer 也要装
  '@deepseek-ai/cordis-plugin-hmr': '^1.0.16'
  '@deepseek-ai/cordis-plugin-timer': '^1.0.1'

  # —— 配置校验：任何实现 Standard Schema 的库都行，选它是因为它双向 ——
  '@deepseek-ai/schemastery': '^3.18.1'

  # —— 配置读写：必须和 cordis-plugin-include 用同一大版本，否则 !!js 方言解析不了 ——
  'js-yaml': '^4.1.0'
  '@types/js-yaml': '^4.0.9'

  # —— 工具链 ——
  '@biomejs/biome': '^2.5.10'
  'vitest': '^3.2.4'
  '@types/node': '^26.2.0'
  'typescript': '^5.9.0'
  'tsx': '^4.23.12'

# ═══════════════════════════════════════════════════════════════════════
# 依赖安装期脚本白名单
#
# pnpm 默认禁止依赖跑 postinstall。这里逐个显式表态，
# 免得每次 install 都弹 "Ignored build scripts" 黄框。
# ═══════════════════════════════════════════════════════════════════════
allowBuilds:
  esbuild: true                      # tsx 的底座，需要就地放置二进制
  node-addon-require-builtin: false  # 用官方预编译产物，不在本机现编译

# ═══════════════════════════════════════════════════════════════════════
# 具名目录（按需启用）
#
# ⚠️ 先分清两个 catalog —— 它们分属两套语法，很容易混：
#
#   pnpm-workspace.yaml 里的是【配置字段名】
#     catalog:      装「默认目录」的内容
#     catalogs:     装「一堆具名目录」，所以是复数
#
#   package.json 里的是【依赖协议】，和 workspace: / npm: / file: 同类
#     "catalog:"        默认目录
#     "catalog:cli"     名叫 cli 的那个目录        ← 协议名永远单数
#
#   写成 "catalogs:cli" 会报 ERR_PNPM_SPEC_NOT_SUPPORTED_BY_ANY_RESOLVER。
#   复数只出现在「装东西的容器」那一侧。
#
# 用法：同一个库要在仓库里并存多个版本时用它。版本号依然只写在本文件里，
# 只是分了组：
#
#   catalogs:
#     legacy:
#       react: '^18.3.1'
#
#   apps/web/package.json        "react": "catalog:"         → 默认目录
#   apps/marketing/package.json  "react": "catalog:legacy"   → 具名目录
#
# 🚫 但【框架本体不许开第二个目录】。
#   给 @deepseek-ai/cordis 开具名目录 = 故意制造两份实体。
#   实测两份共存的后果：instanceof 失效、跨副本的 ctx 拿不到服务，
#   而基本调用居然还能跑 —— 不会当场崩，所以最危险。
#   门禁 verify-catalog 会拦这件事。
#
# 门禁认这两种写法，并且会检查引用的目录真的存在、里面真的有这个包 ——
# 拼错目录名不用等到 install 才发现。
# ═══════════════════════════════════════════════════════════════════════
