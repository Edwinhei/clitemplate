# apps/cli/cordis.yml
#
# 这个 app 的【默认组合】—— 全仓库唯一知道「哪块招牌由谁来挂」的地方。
# 部署时的实际组合，未来由 patch 层覆盖（步骤 9）。
#
# 注意：基础的日志 sink（控制台）由 boot.ts 直接挂载，不在这里。
# 它必须早于配置树 —— 否则这里的插件打的第一批日志会被丢弃。

- id: hello
  name: './src/plugins/hello.ts'       # 本地插件：相对路径，以本文件所在目录为基准

# ── 日志 sink 不在这里 ────────────────────────────────────
# 它们由 boot.ts 挂载。配置树里的条目是 Promise.allSettled 并发 apply 的，
# 在这里挂 sink 会漏掉启动最早期的日志（实测：hello 的 sn=1 那条就收不到）。
# 想同时落盘：CTL_LOG_FILE=./ctl.log pnpm ctl

# ── 宿主事实 ──────────────────────────────────────────────
- id: env
  name: '@ctl/env-launch'              # shell 环境变量 + apps/cli/.env，分两层
  # 换成 @ctl/env-static 就完全不碰 process，用于测试 / 浏览器 / 云端：
  # name: '@ctl/env-static'
  # config:
  #   values:
  #     CTL_NOTIFY_TO: 'bob'

# ── notify 能力 ───────────────────────────────────────────
- id: notify
  name: '@ctl/notify-console'          # 提供方：换实现只改这一行
  # name: '@ctl/notify-file'           # 另一个提供方（写文件）
  # config:
  #   path: './notify.log'             #   相对本文件所在目录

- id: tool-notify
  name: '@ctl/tool-notify'             # 消费方：inject ['notify', 'env']
