# apps/cli/cordis.yml
#
# 基线组合 —— 声明这个 app【所有可能的】条目。
#
# 备选项写在这里但 disabled: true。为什么不干脆删掉？
# 因为 patch 【不能改 name】（name 在 patch 里是断言，不是修改）。
# 所以「换实现」的正确姿势是：基线声明全部候选，patch 只负责开关。
#
# 这么做的额外好处：一眼看得出这个 app 到底可能装哪些东西 ——
# 而不是散落在若干个 patch 文件里等你去拼。
#
# 注意：日志 sink 和 HMR 由 boot.ts 挂载，不在这里。
#   · sink 必须早于配置树，否则最早那批日志会被丢弃
#   · HMR 是运行形态的切换（它把进程钉住），走 CTL_WATCH=1
#
# 用法：
#   pnpm ctl                        基线组合
#   CTL_PROFILE=prod pnpm ctl       叠加 patches/prod.yml
#   pnpm ctl --dump-config          只打印最终组合，不启动
#   pnpm ctl:watch                  热重载模式

- id: hello
  name: './src/plugins/hello.ts'       # 本地插件：相对路径，以本文件所在目录为基准

# ── 宿主事实：env 招牌，二选一 ─────────────────────────────
- id: env
  name: '@ctl/env-launch'              # shell 环境变量 + apps/cli/.env，分两层

- id: env-static                       # 备选：值写死，完全不碰 process
  name: '@ctl/env-static'
  disabled: true
  config:
    values:
      CTL_NOTIFY_TO: 'fixed-in-config'

# ── notify 能力：提供方二选一 ──────────────────────────────
- id: notify
  name: '@ctl/notify-console'

- id: notify-file                      # 备选：写文件
  name: '@ctl/notify-file'
  disabled: true
  config:
    path: './notify.log'

- id: tool-notify
  name: '@ctl/tool-notify'             # 消费方：inject ['notify', 'env']

- id: notify-audit
  name: '@ctl/notify-audit'            # 观察方：听 notify/sent 记账。不 inject 任何东西

- id: notify-quiet-policy              # 策略方：听 notify/before-send，一票否决
  name: '@ctl/notify-quiet-policy'     #   摘掉它通知照发 —— 这就是 -policy 后缀的含义
  config:
    mute: []                           #   把收件人填进来就会被拦下，例如 ['ops']

# ── 多租户：同名招牌，不同实体 ────────────────────────────
# 两个区各挂一个【叫 notify 的招牌】。默认情况下这会撞车
# （07 篇「规矩一」：招牌不能重名），isolate 让它们落进不同的分区。
#
# 注意消费方 task-heartbeat 里【没有任何一处】提到分区 ——
# 它只写 inject: ['notify']，拿到哪一块由它所在的区决定。

- id: tenant-a
  name: '@deepseek-ai/cordis-plugin-group'
  isolate:
    notify: 'tenant-a'                 # ← 本区自成一个 notify 分区
  config:
    - id: a-notify
      name: '@ctl/notify-file'
      config:
        path: './tenant-a.log'
    - id: a-task
      name: '@ctl/task-heartbeat'
      config:
        label: 'A 区'
        intervalMs: 150
        times: 2

- id: tenant-b
  name: '@deepseek-ai/cordis-plugin-group'
  isolate:
    notify: 'tenant-b'
  config:
    - id: b-notify
      name: '@ctl/notify-file'
      config:
        path: './tenant-b.log'
    - id: b-task
      name: '@ctl/task-heartbeat'
      config:
        label: 'B 区'
        intervalMs: 150
        times: 2
